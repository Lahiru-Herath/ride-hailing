services:
    kafka:
        image: apache/kafka:4.1.2
        container_name: kafka
        ports:
            - "9094:9094" # host-accessible listener
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
        volumes:
            - kafka-data:/tmp/kraft-combined-logs

    postgres:
        image: postgres:18
        container_name: postgres
        restart: always
        environment:
            POSTGRES_USER: pipeline
            POSTGRES_PASSWORD: pipeline
            POSTGRES_DB: ridehailing
        ports:
            - "5433:5432"
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U pipeline"]
            interval: 5s
            timeout: 5s
            retries: 10

    airflow:
        build:
            context: ./orchestration
            dockerfile: Dockerfile
        image: ride-hailing-airflow:3.3.2-custom
        container_name: airflow
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            AIRFLOW__CORE__EXECUTOR: LocalExecutor
            AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://pipeline:pipeline@postgres/airflow_meta
            AIRFLOW__CORE__LOAD_EXAMPLES: "false"
            _AIRFLOW_WWW_USER_USERNAME: admin
            _AIRFLOW_WWW_USER_PASSWORD: admin
            # Fixed Simple Auth Manager login so the healthcheck can get a JWT (D48). Dev/test auth manager only.
            AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: "admin:admin"
            AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_PASSWORDS_FILE: /opt/airflow/simple_auth_passwords.json
            # Filesystem connection used by FileSensor (base path = the mounted storage folder, D28)
            AIRFLOW_CONN_FS_DEFAULT: '{"conn_type": "fs", "extra": {"path": "/opt/airflow/storage"}}'
            # Config for processing/batch_reconciliation.py (app DB, not the airflow_meta DB)
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            POSTGRES_DB: ridehailing
            POSTGRES_USER: pipeline
            POSTGRES_PASSWORD: pipeline
            STORAGE_ROOT: /opt/airflow/storage
            SIM_DAY_DURATION_SECONDS: 300
            STREAM_FLUSH_GRACE_SECONDS: 90
        volumes:
            - ./orchestration/dags:/opt/airflow/dags
            - ./orchestration/simple_auth_passwords.json:/opt/airflow/simple_auth_passwords.json
            - ./storage:/opt/airflow/storage
            - ./processing:/opt/airflow/project/processing
            - ./observability:/opt/airflow/project/observability
        ports:
            - "8080:8080"
        command: standalone

    spark:
        build:
            context: ./processing
            dockerfile: Dockerfile
        image: ride-hailing-spark:4.1.3-custom
        container_name: spark
        depends_on:
            - kafka
            - postgres
        environment:
            POSTGRES_HOST: postgres
            POSTGRES_DB: ridehailing
            POSTGRES_USER: pipeline
            POSTGRES_PASSWORD: pipeline
            KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            KAFKA_TOPIC_TRIP_EVENTS: trip_events
            IDLE_ALERT_THRESHOLD_MINUTES: 10
        volumes:
            - ./processing:/opt/spark-apps
            - ./storage:/opt/spark-apps/storage
            - ./observability:/opt/spark-apps/observability
            - spark-ivy-cache:/root/.ivy2
        command: >
            /opt/spark/bin/spark-submit
            --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.1.3
            /opt/spark-apps/speed_layer_job.py

    healthcheck:
        build:
            context: ./observability
            dockerfile: Dockerfile
        image: ride-hailing-healthcheck:0.1.0
        container_name: healthcheck
        restart: unless-stopped
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            KAFKA_BOOTSTRAP_SERVERS: kafka:9092
            KAFKA_TOPIC_TRIP_EVENTS: trip_events
            POSTGRES_HOST: postgres
            POSTGRES_PORT: 5432
            POSTGRES_DB: ridehailing
            POSTGRES_USER: pipeline
            POSTGRES_PASSWORD: pipeline
            AIRFLOW_URL: http://airflow:8080
            AIRFLOW_USER: admin
            AIRFLOW_PASSWORD: admin
            AIRFLOW_DAG_ID: daily_reconciliation
            HEALTH_CHECK_INTERVAL_SECONDS: 15
        volumes:
            - ./observability:/app/observability:ro

    api:
        build:
            context: .
            dockerfile: serving/Dockerfile
        image: ride-hailing-api:0.1.0
        container_name: api
        restart: on-failure
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql+psycopg2://pipeline:pipeline@postgres:5432/ridehailing
        ports:
            - "8000:8000"
        healthcheck:
            test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
            interval: 15s
            timeout: 5s
            retries: 5
            start_period: 10s

volumes:
    pgdata:
    spark-ivy-cache:
    kafka-data: