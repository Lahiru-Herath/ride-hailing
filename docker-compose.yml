services:
    kafka:
        image: apache/kafka:4.1.2
        container_name: kafka
        ports:
            - "9094:9094" # host-accessible listener
        environment:
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker,controller
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9094
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9094
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    postgres:
        image: postgres:18
        container_name: postgres
        restart: always
        environment:
            POSTGRES_USER: pipeline
            POSTGRES_PASSWORD: pipeline
            POSTGRES_DB: ridehailing
        ports:
            - "5433:5432"
        volumes:
            - pgdata:/var/lib/postgresql
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U pipeline"]
            interval: 5s
            timeout: 5s
            retries: 10

    airflow:
        image: apache/airflow:3.3.2
        container_name: airflow
        depends_on:
            postgres:
                condition: service_healthy
        environment:
            AIRFLOW__CORE__EXECUTOR: LocalExecutor
            AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://pipeline:pipeline@postgres/airflow_meta
            AIRFLOW__CORE__LOAD_EXAMPLES: "false"
            _AIRFLOW_WWW_USER_USERNAME: admin
            _AIRFLOW_WWW_USER_PASSWORD: admin
        volumes:
            - ./orchestration/dags:/opt/airflow/dags
            - ./storage:/opt/airflow/storage
        ports:
            - "8080:8080"
        command: standalone

volumes:
    pgdata:
